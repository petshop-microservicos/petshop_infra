name: petshop

services:
  usuarios:
    build: ../petshop_usuarios
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  animais-tutores:
    build: ../petshop_animais_tutores
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  agendamentos:
    build: ../petshop_agendamentos
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Servicos__AnimaisTutores__BaseUrl: http://animais-tutores:8080/
    depends_on:
      - animais-tutores

  estoque:
    build: ../petshop_estoque
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  comercial:
    build: ../petshop_comercial
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Servicos__Estoque__BaseUrl: http://estoque:8080/
    depends_on:
      - estoque
